[package]
name = "logisim-gui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Graphical user interface for Logisim-RUST using egui/eframe"

[dependencies]
logisim-core = { workspace = true }
logisim-file = { workspace = true }
serde = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["file"] }
rfd = "0.15"

[[bin]]
name = "logisim"
path = "src/main.rs"
